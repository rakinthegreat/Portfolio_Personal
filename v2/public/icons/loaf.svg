<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Loaf: a game for cats. A koi curving through a dark pond, a paw-tap ripple where it's headed. -->
  <defs>
    <radialGradient id="pond" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#2f7f86"/>
      <stop offset="1" stop-color="#0f3a45"/>
    </radialGradient>
    <linearGradient id="koi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4efe6"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="url(#pond)"/>
  <!-- ripple from a paw tap -->
  <g fill="none" stroke="#bfe9e6" stroke-linecap="round">
    <ellipse cx="132" cy="58" rx="16" ry="10" stroke-width="3" opacity="0.8"/>
    <ellipse cx="132" cy="58" rx="30" ry="19" stroke-width="2.4" opacity="0.45"/>
    <ellipse cx="132" cy="58" rx="44" ry="28" stroke-width="2" opacity="0.2"/>
  </g>
  <!-- paw print -->
  <g fill="#e08a3c" opacity="0.95">
    <ellipse cx="132" cy="62" rx="7.5" ry="6"/>
    <circle cx="122.5" cy="53" r="3.2"/>
    <circle cx="129" cy="49" r="3.2"/>
    <circle cx="136" cy="49" r="3.2"/>
    <circle cx="142" cy="53" r="3.2"/>
  </g>
  <!-- the koi, swimming up and to the right in a lazy S -->
  <g transform="rotate(-38 92 118)">
    <path d="M40 118c4-14 22-24 44-24 20 0 34 9 40 24-6 15-20 24-40 24-22 0-40-10-44-24z" fill="url(#koi)"/>
    <path d="M40 118l-22-16c4 10 4 22 0 32z" fill="#f08a2a"/>
    <path d="M56 104c10-6 22-6 30 2-6 10-20 14-32 8z" fill="#ef6a22"/>
    <path d="M92 128c8-6 18-6 24 0-6 7-16 9-24 6z" fill="#ef6a22"/>
    <path d="M100 100c4-3 10-3 13 1-3 4-9 5-13 3z" fill="#1c1c1c" opacity="0.75"/>
    <path d="M70 140c4 8 12 10 16 6-6-2-10-6-12-12z" fill="#f4b27a"/>
    <path d="M70 96c4-8 12-10 16-6-6 2-10 6-12 12z" fill="#f4b27a"/>
    <circle cx="114" cy="113" r="2.6" fill="#1c1c1c"/>
  </g>
</svg>
