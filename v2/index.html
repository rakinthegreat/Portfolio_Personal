  <style>
    /* the loading screen, inline so it's there on the very first paint: the logo assembles, then each of the letters
       hidden in its white space lights up in turn (R the whole white disc, A around the middle wedge, K the left column
       and its two arms, I the left column, N the left column, the diagonal and the right column) while R A K I N
       spells out beneath. Every highlight is its own layer
       and only opacity / transform animate, which the browser runs off the main thread, so it keeps going while the
       3D desk is built and its shaders compiled behind it. */
    .boot {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      align-content: center;
      gap: 28px;
      background: radial-gradient(ellipse at 50% 42%, #2a1a0b, #0d0905 70%);
      color: #f4e6cc;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    html.booting .boot { display: grid; }
    html.booting.booted .boot { opacity: 0; visibility: hidden; }
    .boot-art { position: relative; width: min(190px, 44vw); aspect-ratio: 1; }
    .boot-art svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .boot-disc { will-change: transform, opacity; animation: boot-in 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .boot-piece { will-change: transform, opacity; animation: boot-slide 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .boot-piece:nth-of-type(2) { animation-delay: 0.25s; }
    .boot-piece:nth-of-type(3) { animation-delay: 0.4s; }
    .boot-piece:nth-of-type(4) { animation-delay: 0.55s; }
    .boot-hl { opacity: 0; will-change: opacity; filter: drop-shadow(0 0 6px rgba(255, 170, 80, 0.7)); animation: boot-hl 4.5s 1s ease-in-out infinite; }
    .boot-word { display: flex; gap: 0.9em; margin: 0; font: 700 18px 'Space Mono', ui-monospace, monospace; }
    .boot-word span { opacity: 0.28; will-change: opacity; animation: boot-letter 4.5s 1s ease-in-out infinite; }
    .boot-hl.l2, .boot-word span:nth-child(2) { animation-delay: 1.9s; }
    .boot-hl.l3, .boot-word span:nth-child(3) { animation-delay: 2.8s; }
    .boot-hl.l4, .boot-word span:nth-child(4) { animation-delay: 3.7s; }
    .boot-hl.l5, .boot-word span:nth-child(5) { animation-delay: 4.6s; }
    @keyframes boot-in { from { opacity: 0; transform: scale(0.82); } }
    @keyframes boot-slide { from { opacity: 0; transform: translateX(-14%); } }
    @keyframes boot-hl { 0%, 24%, 100% { opacity: 0; } 5%, 17% { opacity: 1; } }
    @keyframes boot-letter { 0%, 24%, 100% { opacity: 0.28; } 5%, 17% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .boot * { animation: none !important; }
      .boot-word span { opacity: 1; }
    }
  </style>
