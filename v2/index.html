  <script>
    // pick the view before first paint: ?view=standard|desk, or a choice the visitor asked us to remember;
    // otherwise every visit starts on the entry screen
    document.documentElement.classList.add('js');
    try {
      var q = new URLSearchParams(location.search).get('view');
      var v = q || localStorage.getItem('view');
      // ?view=pick: show the entry screen again (a remembered choice stays until it's unticked there)
      if (q === 'pick') { var u = new URL(location.href); u.searchParams.delete('view'); history.replaceState(null, '', u); v = null; }
      // no choice yet: both views run underneath the entry screen, one per half
      if (v !== 'standard' && v !== 'desk') document.documentElement.classList.add('gating');
      // the 3D desk is coming (on the entry screen or on its own): the loading screen covers it while it builds
      if (v !== 'standard') document.documentElement.classList.add('booting');
      if (v === 'standard' || v === 'desk') document.documentElement.dataset.view = v;
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      // the 3D desk is always the lamp-lit night (whatever the standard page's theme is set to)
      if (v === 'desk') document.documentElement.dataset.theme = 'dark';
    } catch (e) { }
  </script>
  <style>
    /* the loading screen, inline so it's there on the very first paint: the logo comes in whole (its pieces never move
       out of line), then its white fills like a clock hand sweeping round, empties the
       same way and fills again, with a
       short note underneath. Only opacity / transform animate, on separate layers, which the browser runs off the
       main thread: it stays smooth while the 3D desk is built and its shaders compiled behind it. */
    .boot {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      align-content: center;
      gap: 34px;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 40%, #2a1a0b, #0d0905 70%);
      color: #f4e6cc;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    html.booting .boot { display: grid; }
    html.booting.booted .boot { opacity: 0; visibility: hidden; }
    .boot-art { position: relative; width: min(150px, 38vw); aspect-ratio: 1; }
    .boot-art svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .boot-disc { will-change: transform, opacity; animation: boot-in 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    /* the white of the disc fills like a clock hand sweeping round, then empties the same way, then fills again.
       Two clipped halves, each with a white half-disc turning behind it: only rotation animates */
    .boot-sweep { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; animation: boot-in 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .boot-sweep > span { position: absolute; top: 0; width: 50%; height: 100%; overflow: hidden; }
    .boot-sweep > .r { left: 50%; }
    .boot-sweep > .l { left: 0; }
    .boot-sweep i { position: absolute; top: 0; width: 100%; height: 100%; background: #f4e6cc; will-change: transform; animation-duration: 3.2s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .boot-sweep .r i { left: -100%; border-radius: 999px 0 0 999px; transform-origin: 100% 50%; animation-name: boot-hand-r; }
    .boot-sweep .l i { left: 100%; border-radius: 0 999px 999px 0; transform-origin: 0 50%; animation-name: boot-hand-l; }
    /* the black pieces never move on their own: they come in with the disc, as one logo */
    .boot-piece { will-change: transform, opacity; animation: boot-in 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .boot-note { max-width: 32rem; margin: 0; text-align: center; font: 400 16px/1.6 'Space Grotesk', system-ui, sans-serif; color: rgba(244, 230, 204, 0.78); animation: boot-fade 0.8s 0.5s both; }
    .boot-note b { display: block; margin-bottom: 6px; font-size: 22px; font-weight: 700; color: #f4e6cc; }
    @keyframes boot-in { from { opacity: 0; transform: scale(0.82); } }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    /* fill: right half 0-25%, left half 25-50%; empty: right half 50-75%, left half 75-100% (all clockwise) */
    @keyframes boot-hand-r { 0% { transform: rotate(0deg); } 25%, 50% { transform: rotate(180deg); } 75%, 100% { transform: rotate(360deg); } }
    @keyframes boot-hand-l { 0%, 25% { transform: rotate(0deg); } 50%, 75% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
    @keyframes boot-fade { from { opacity: 0; transform: translateY(6px); } }
    @media (prefers-reduced-motion: reduce) {
      .boot * { animation: none !important; }
      .boot-sweep i { transform: rotate(180deg); } /* still: the disc simply full */
    }
  </style>
